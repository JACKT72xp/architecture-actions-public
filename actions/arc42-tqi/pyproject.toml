[build-system]
requires = ["setuptools==75.8.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "arc42-tqi-action"
version = "0.2.1"
description = "Deterministic arc42 quality metrics and evidence-ready architecture drift contracts"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = ["PyYAML==6.0.2", "pydantic==1.10.24", "markdown-it-py==3.0.0", "typer==0.15.4"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Documentation",
]

[project.optional-dependencies]
test = ["pytest==8.3.5", "jsonschema==4.23.0", "ruff==0.11.2", "mypy==1.15.0", "types-PyYAML==6.0.12.20241230"]

[project.scripts]
arc42-tqi = "arc42_tqi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arc42_tqi = ["default-config.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
