name: Release arc42 TQI Action
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version matching pyproject.toml, such as v0.1.0
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: arc42-tqi-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: actions/arc42-tqi
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ inputs.version }}
      RELEASE_TAG: arc42-tqi/${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release input and test source
        run: |
          python -m pip install -e '.[test]'
          python - <<'PY'
          import os, re, tomllib
          version = os.environ["VERSION"]
          assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", version)
          with open("pyproject.toml", "rb") as stream:
              assert version == "v" + tomllib.load(stream)["project"]["version"]
          PY
          if git rev-parse --verify "refs/tags/$RELEASE_TAG"; then
            echo "Release tag already exists; refusing to overwrite it."
            exit 1
          fi
          python -m pytest -q
          python -m ruff check src tests scripts
          python -m mypy src
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and push prebuilt multi-platform image
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-arc42-tqi"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx build --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            --tag "$image:build-$GITHUB_SHA" --metadata-file image-metadata.json --push .
          digest="$(python -c 'import json; print(json.load(open("image-metadata.json"))["containerimage.digest"])')"
          echo "reference=$image@$digest" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Smoke-test final Action capabilities before tagging
        env:
          IMAGE: ${{ steps.image.outputs.reference }}
        run: |
          docker logout ghcr.io
          docker pull "$IMAGE"
          python scripts/smoke_image.py --image "$IMAGE" --platform linux/amd64
          python scripts/smoke_image.py --image "$IMAGE" --platform linux/arm64
      - name: Publish digest-pinned release commit and tag
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          python scripts/prepare_release.py --repository "${GITHUB_REPOSITORY,,}-arc42-tqi" \
            --digest "$DIGEST" --version "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --detach
          git add action.yml
          git commit -m "Pin $VERSION to its immutable GHCR image"
          git tag "$RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
          gh release create "$RELEASE_TAG" --verify-tag --title "arc42 TQI $VERSION" --generate-notes
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
