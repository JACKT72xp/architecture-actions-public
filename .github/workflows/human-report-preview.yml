name: Preview human-readable TQI report
on:
  push:
    branches: [feat/human-readable-tqi-report]
  workflow_dispatch:
    inputs:
      fixture:
        description: Example documentation to analyze
        type: choice
        options: [poor, mature]
        default: poor
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Generate machine evidence and human reports from this branch
        uses: ./actions/arc42-tqi
        with:
          docs-path: actions/arc42-tqi/tests/fixtures/${{ inputs.fixture || 'poor' }}/docs
          adr-path: actions/arc42-tqi/tests/fixtures/${{ inputs.fixture || 'poor' }}/docs/adr
          output-dir: .arc42-tqi-preview
          min-tqi: '0'
          fail-on-severity: none
      - name: Upload downloadable reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: tqi-human-report-${{ inputs.fixture || 'poor' }}
          path: .arc42-tqi-preview/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
