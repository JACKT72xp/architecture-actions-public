name: arc42 TQI CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: actions/arc42-tqi
    strategy:
      matrix:
        python: ['3.12']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python -m ruff check src tests scripts
      - run: python -m mypy src
      - run: python -m pip wheel --no-deps . --wheel-dir dist
  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: ./actions/arc42-tqi
        id: tqi
        with:
          docs-path: actions/arc42-tqi/tests/fixtures/mature/docs
          adr-path: actions/arc42-tqi/tests/fixtures/mature/docs/adr
          min-tqi: '90'
          fail-on-severity: high
      - name: Assert final Action outputs and artifacts
        env:
          MATURITY: ${{ steps.tqi.outputs.maturity-level }}
          REPORT: ${{ steps.tqi.outputs.report-path }}
          CLAIMS: ${{ steps.tqi.outputs.claims-path }}
          PROMPTS: ${{ steps.tqi.outputs.drift-prompts-dir }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          output = Path(".arc42-tqi")
          assert os.environ["MATURITY"] == "L4"
          report = json.loads(Path(os.environ["REPORT"]).read_text())
          assert Path(os.environ["CLAIMS"]).is_file()
          assert len(list(Path(os.environ["PROMPTS"]).glob("*.md"))) == 3
          assert report["semantic_enrichment"]["status"] == "disabled"
          assert len(report["prompt_manifest"]) == 3
          for entry in report["prompt_manifest"]:
              assert Path(entry["path"]).is_file()
          assert report["maturity_level"] == "L4"
          assert report["tqi_score"] == 100
          assert report["quality_gate"]["passed"]
          assert not report["findings"]
          assert (output / "claims.json").is_file()
          assert (output / "claims.yaml").is_file()
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: architecture-evidence
          path: .arc42-tqi/
          include-hidden-files: true

  distribution:
    name: Distribution export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Export committed source and canonical distribution files
        run: |
          python distribution/arc42-tqi/.github/scripts/sync_upstream.py --source . --ref "$GITHUB_SHA" --destination "$RUNNER_TEMP/distribution"
          python distribution/arc42-tqi/.github/scripts/sync_upstream.py --source . --ref "$GITHUB_SHA" --destination "$RUNNER_TEMP/distribution" --check
      - run: python -m pip install -e 'actions/arc42-tqi[test]' pip-audit==2.10.0
      - run: python -m unittest discover -s distribution/arc42-tqi/.github/tests -v
      - run: python -m ruff check distribution/arc42-tqi/.github/scripts distribution/arc42-tqi/.github/tests
      - run: python -m pip_audit -r actions/arc42-tqi/requirements-runtime.txt --no-deps --disable-pip
      - name: Validate exported workflow syntax
        working-directory: ${{ runner.temp }}/distribution
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -ignore 'file "/usr/local/bin/arc42-tqi" does not exist' .github/workflows/*.yml

      - name: Smoke-test exported image with Linux filesystem ownership
        working-directory: ${{ runner.temp }}/distribution
        run: |
          docker build -t arc42-tqi:upstream-export .
          python scripts/smoke_image.py --image arc42-tqi:upstream-export --platform linux/amd64
